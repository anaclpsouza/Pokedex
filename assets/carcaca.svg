<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 630" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Gradiente da carcaça vermelha metálica -->
    <linearGradient id="carcaca-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d63" />
      <stop offset="26%" stop-color="#dc0a2d" />
      <stop offset="72%" stop-color="#c00824" />
      <stop offset="100%" stop-color="#a3001f" />
    </linearGradient>

    <!-- Gradiente 3D da dobradiça cilíndrica central -->
    <linearGradient id="carcaca-hinge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c0010" />
      <stop offset="30%" stop-color="#b50d2a" />
      <stop offset="50%" stop-color="#ff6b80" />
      <stop offset="70%" stop-color="#b50d2a" />
      <stop offset="100%" stop-color="#5c0010" />
    </linearGradient>

    <!-- Gradiente do LED amarelo decorativo -->
    <radialGradient id="led-yellow-deco" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="22%" stop-color="#ffd23d" />
      <stop offset="100%" stop-color="#8c6f00" />
    </radialGradient>
  </defs>

  <g id="dex-chassis-desktop">
    <!-- 1. CARCAÇA ESQUERDA -->
    <g id="shell-left">
      <path d="M 26 2 L 282 2 L 348 90 L 533 90 L 533 628 L 26 628 A 24 24 0 0 1 2 604 L 2 26 A 24 24 0 0 1 26 2 Z" fill="url(#carcaca-red)" stroke="#000000" stroke-width="4" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
      <path d="M 27 6 L 280 6 L 346 94 L 529 94 L 529 624 L 27 624 A 20 20 0 0 1 6 603 L 6 27 A 20 20 0 0 1 27 6 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" vector-effect="non-scaling-stroke" />
      <path d="M 527 98 L 527 622 L 30 622" fill="none" stroke="#000000" stroke-width="4" stroke-opacity="0.22" vector-effect="non-scaling-stroke" />
    </g>

    <!-- 2. DOBRADIÇA CENTRAL CILÍNDRICA -->
    <g id="shell-hinge">
      <rect x="533" y="90" width="34" height="538" fill="url(#carcaca-hinge)" stroke="#000000" stroke-width="4" vector-effect="non-scaling-stroke" />
      <line x1="533" y1="186" x2="567" y2="186" stroke="#000000" stroke-width="4" vector-effect="non-scaling-stroke" />
      <line x1="533" y1="358" x2="567" y2="358" stroke="#000000" stroke-width="4" vector-effect="non-scaling-stroke" />
      <line x1="533" y1="530" x2="567" y2="530" stroke="#000000" stroke-width="4" vector-effect="non-scaling-stroke" />
    </g>

    <!-- 3. CARCAÇA DIREITA -->
    <g id="shell-right">
      <path d="M 567 90 L 1074 90 A 24 24 0 0 1 1098 114 L 1098 604 A 24 24 0 0 1 1074 628 L 567 628 Z" fill="url(#carcaca-red)" stroke="#000000" stroke-width="4" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
      <path d="M 571 94 L 1070 94 A 20 20 0 0 1 1094 116 L 1094 602 A 20 20 0 0 1 1070 624 L 571 624 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" vector-effect="non-scaling-stroke" />
      <path d="M 1092 120 L 1092 600 L 571 600" fill="none" stroke="#000000" stroke-width="4" stroke-opacity="0.22" vector-effect="non-scaling-stroke" />

      <!-- Slots Decorativos Inferiores e LED Amarelo Direito -->
      <g id="svg-right-deco" transform="translate(910, 592)">
        <rect x="0" y="0" width="60" height="12" rx="3" fill="#f4f4f4" stroke="#000" stroke-width="3" />
        <rect x="72" y="0" width="60" height="12" rx="3" fill="#f4f4f4" stroke="#000" stroke-width="3" />
        <circle cx="152" cy="6" r="7" fill="url(#led-yellow-deco)" stroke="#000" stroke-width="3" />
      </g>
    </g>
  </g>
</svg>