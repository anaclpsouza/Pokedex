<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Pokédex</title>
  <meta name="description" content="Interactive retro Pokédex built with PokéAPI: search Pokémon, view animated sprites, stats, evolutions, and moves!">
  <link rel="icon" href="assets/pokeball.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://pokeapi.co">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pokedex.css">
</head>
<body>
  <div id="boot" class="boot" role="dialog" aria-label="Loading Pokédex" hidden>
    <div class="boot__half boot__half--top"></div>
    <div class="boot__half boot__half--bottom"></div>
    <div class="boot__band"></div>
    <div class="boot__button">
      <img src="assets/pokeball.svg" alt="Loading" class="boot__ball-img">
    </div>
    <div class="boot__content boot__content--top">
      <p class="boot__title">POKÉDEX</p>
      <p class="boot__sub">RETRO EDITION</p>
    </div>
    <div class="boot__content boot__content--bottom">
      <div class="boot__bar"><span id="boot-progress"></span></div>
      <p id="boot-msg" class="boot__msg">CONNECTING TO POKÉAPI...</p>
      <button id="boot-start" class="boot__start" hidden>▶ PRESS START</button>
      <button id="boot-retry" class="btn-retro" hidden>TRY AGAIN</button>
    </div>
  </div>

  <div class="app">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Retro Pokédex - home">
        <img src="assets/pokeball.svg" alt="" class="brand__ball" width="42" height="42">
        <span class="brand__title">POKÉDEX<small>RETRO</small></span>
      </a>

      <nav class="tabs" role="tablist" aria-label="Sections">
        <a class="tab is-active" id="tab-dex" href="index.html" role="tab" aria-selected="true">POKÉDEX</a>
        <a class="tab" id="tab-explore" href="pages/explore.html" role="tab" aria-selected="false">EXPLORE</a>
      </nav>

      <div class="topbar__tools">
        <div class="team-wrap">
          <span class="team-label">PARTY</span>
          <div class="team" id="team" aria-label="My party"></div>
        </div>
      </div>
    </header>

    <main>
      <section id="view-dex" class="view" role="tabpanel" aria-labelledby="tab-dex">
        <h1 class="sr-only">Retro Pokédex</h1>

        <div class="dex" id="dex">
          <div class="dex__chassis" aria-hidden="true">
            <img src="assets/carcaca.svg" alt="" class="dex__chassis-desktop">
            <img src="assets/carcaca-mobile.svg" alt="" class="dex__chassis-mobile">
          </div>

          <div class="dex__left">
            <div class="dex__top">
              <img class="lens" id="lens" src="assets/lens.svg" alt="Optical sensor" width="84" height="84">
              <img class="leds" id="leds" src="assets/leds.svg" alt="Status LEDs" width="80" height="24">
            </div>

            <div class="screen-frame">
              <div class="screen-frame__dots" aria-hidden="true"><i></i><i></i></div>
              <div class="screen" id="dex-screen" data-scene="type">
                <img class="screen__sun" src="assets/screen-sun.svg" alt="" aria-hidden="true">
                <img class="screen__platform" src="assets/screen-platform.svg" alt="" aria-hidden="true">

                <span class="screen__num" id="dex-num">#0000</span>
                <div class="screen__badges" id="dex-badges"></div>

                <img id="dex-sprite" class="screen__sprite pixel" alt="Pokémon sprite">

                <div class="screen__loader">
                  <img src="assets/pokeball.svg" alt="Loading..." class="spin" width="46" height="46">
                </div>

                <img src="assets/pokeball.svg" alt="" class="catch-ball" width="42" height="42">
                <img class="catch-stars" src="assets/catch-stars.svg" alt="" aria-hidden="true">
                <img class="sparkles" src="assets/sparkles.svg" alt="" aria-hidden="true">
              </div>
            </div>

            <div class="controls">
              <button class="round-btn" id="btn-random" aria-label="Random Pokémon" title="Random">
                <img src="assets/botao-aleatorio.svg" alt="?" width="48" height="48">
              </button>

              <div class="pill-btns">
                <button class="pill pill--red" id="btn-shiny" title="Shiny version">✦ SHINY</button>
                <button class="pill pill--blue" id="btn-flip" title="View back sprite">↻ FLIP</button>
              </div>

              <div class="dpad" aria-label="Navigation">
                <img src="assets/dpad.svg" alt="" class="dpad__img">
                <button class="dpad__up" data-step="-10" aria-label="Back 10"></button>
                <button class="dpad__left" data-step="-1" aria-label="Previous"></button>
                <button class="dpad__right" data-step="1" aria-label="Next"></button>
                <button class="dpad__down" data-step="10" aria-label="Forward 10"></button>
              </div>
            </div>

            <form class="search" id="dex-search" autocomplete="off" role="search">
              <label for="dex-input" class="sr-only">Search Pokémon by name or number</label>
              <input id="dex-input" class="lcd-input" type="text" placeholder="NAME OR NO..." spellcheck="false">
              <button class="search__btn" id="dex-search-btn" type="submit">SEARCH</button>
              <ul class="suggest" id="dex-suggest" role="listbox"></ul>
            </form>
          </div>

          <div class="dex__hinge" aria-hidden="true"></div>

          <div class="dex__right">
            <div class="lcd">
              <div class="lcd__head">
                <h2 id="dex-name">---</h2>
                <span id="dex-genus" class="lcd__genus"></span>
              </div>
              <div class="lcd__body" id="dex-panel"></div>
            </div>

            <div class="blue-keys" role="tablist" aria-label="Information tabs">
              <button class="blue-key is-active" data-panel="info" id="key-info">INFO</button>
              <button class="blue-key" data-panel="stats" id="key-stats">STATS</button>
              <button class="blue-key" data-panel="evo" id="key-evo">EVOLUTION</button>
              <button class="blue-key" data-panel="types" id="key-types">TYPES</button>
              <button class="blue-key" data-panel="moves" id="key-moves">MOVES</button>
            </div>

            <div class="dex__actions">
              <button class="action action--catch" id="btn-catch">
                <img src="assets/pokeball.svg" alt="" class="action__ball-img" width="22" height="22">
                <span class="action__txt">CATCH</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
