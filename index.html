<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Pokédex</title>
  <meta name="description" content="Interactive retro Pokédex built with PokéAPI: search Pokémon, view animated sprites, stats, evolutions, and moves!">
  <link rel="icon" href="assets/pokeball.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://pokeapi.co">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pokedex.css">
  <link rel="stylesheet" href="css/explore.css">
</head>
<body>

  <!-- ================= TELA ENTRADA ================= -->
  <div id="boot" class="boot" role="dialog" aria-label="Loading Pokédex">
    <div class="boot__half boot__half--top"></div>
    <div class="boot__half boot__half--bottom"></div>
    <div class="boot__band"></div>
    <div class="boot__button">
      <img src="assets/pokeball.svg" alt="Loading" class="boot__ball-img">
    </div>
    <div class="boot__content boot__content--top">
      <p class="boot__title">POKÉDEX</p>
      <p class="boot__sub">RETRO EDITION</p>
    </div>
    <div class="boot__content boot__content--bottom">
      <div class="boot__bar"><span id="boot-progress"></span></div>
      <p id="boot-msg" class="boot__msg">CONNECTING TO POKÉAPI...</p>
      <button id="boot-start" class="boot__start" hidden>▶ PRESS START</button>
      <button id="boot-retry" class="btn-retro" hidden>TRY AGAIN</button>
    </div>
  </div>

  <div class="app">
    <!-- ================= HEADER ================= -->
    <header class="topbar">
      <a class="brand" href="#dex" aria-label="Retro Pokédex - home">
        <img src="assets/pokeball.svg" alt="" class="brand__ball" width="42" height="42">
        <span class="brand__title">POKÉDEX<small>RETRO</small></span>
      </a>

      <nav class="tabs" role="tablist" aria-label="Sections">
        <button class="tab is-active" id="tab-dex" data-tab="dex" role="tab" aria-selected="true">POKÉDEX</button>
        <button class="tab" id="tab-explore" data-tab="explore" role="tab" aria-selected="false">EXPLORE</button>
      </nav>

      <div class="topbar__tools">
        <div class="team-wrap">
          <span class="team-label">PARTY</span>
          <div class="team" id="team" aria-label="My party"></div>
        </div>
      </div>
    </header>

    <main>
      <!-- ================= POKÉDEX ================= -->
      <section id="view-dex" class="view" role="tabpanel" aria-labelledby="tab-dex">
        <h1 class="sr-only">Retro Pokédex</h1>

        <div class="dex" id="dex">
          <!-- LEFT HALF -->
          <div class="dex__left">
            <div class="dex__top">
              <svg class="lens" id="lens" viewBox="0 0 84 84" role="img" aria-label="Optical sensor">
                <defs>
                  <radialGradient id="lens-optics" cx="35%" cy="32%" r="65%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="14%" stop-color="#99e5ff" />
                    <stop offset="30%" stop-color="#29b6f6" />
                    <stop offset="65%" stop-color="#0288d1" />
                    <stop offset="90%" stop-color="#01579b" />
                    <stop offset="100%" stop-color="#002f6c" />
                  </radialGradient>
                </defs>
                <circle class="lens__ring" cx="42" cy="42" r="39" fill="#b8b8b8" stroke="#111" stroke-width="3"/>
                <circle class="lens__glass" cx="42" cy="42" r="32" fill="url(#lens-optics)" stroke="#000" stroke-width="3"/>
                <ellipse class="lens__shine" cx="32" cy="28" rx="10" ry="5.5" fill="rgba(255,255,255,0.75)" transform="rotate(-32 32 28)"/>
                <circle cx="28" cy="24" r="2.5" fill="#ffffff"/>
              </svg>
              <svg class="leds" viewBox="0 0 80 24" aria-hidden="true">
                <defs>
                  <radialGradient id="led-red-grad" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="25%" stop-color="#ff3b3b"/>
                    <stop offset="100%" stop-color="#8c0000"/>
                  </radialGradient>
                  <radialGradient id="led-yellow-grad" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="25%" stop-color="#ffd53d"/>
                    <stop offset="100%" stop-color="#8c6f00"/>
                  </radialGradient>
                  <radialGradient id="led-green-grad" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="25%" stop-color="#42ea5e"/>
                    <stop offset="100%" stop-color="#146b24"/>
                  </radialGradient>
                </defs>
                <circle class="led led--red" cx="12" cy="12" r="9" fill="url(#led-red-grad)" stroke="#000" stroke-width="2.5"/>
                <circle class="led led--yellow" cx="40" cy="12" r="9" fill="url(#led-yellow-grad)" stroke="#000" stroke-width="2.5"/>
                <circle class="led led--green" cx="68" cy="12" r="9" fill="url(#led-green-grad)" stroke="#000" stroke-width="2.5"/>
              </svg>
            </div>

            <div class="screen-frame">
              <div class="screen-frame__dots" aria-hidden="true"><i></i><i></i></div>
              <div class="screen" id="dex-screen" data-scene="type">
                <svg class="screen__sun" viewBox="0 0 100 100" aria-hidden="true">
                  <circle cx="50" cy="50" r="45" fill="rgba(255,255,255,0.45)"/>
                </svg>
                <svg class="screen__platform" viewBox="0 0 200 60" aria-hidden="true">
                  <ellipse cx="100" cy="30" rx="94" ry="24" fill="rgba(0,0,0,0.28)"/>
                </svg>

                <span class="screen__num" id="dex-num">#0000</span>
                <div class="screen__badges" id="dex-badges"></div>

                <img id="dex-sprite" class="screen__sprite pixel" alt="" title="Click to play cry">

                <div class="screen__loader">
                  <img src="assets/pokeball.svg" alt="Loading..." class="spin" width="46" height="46">
                </div>

                <img src="assets/pokeball.svg" alt="" class="catch-ball" width="42" height="42">

                <svg class="catch-stars" viewBox="0 0 160 80" aria-hidden="true">
                  <path d="M30 20 L34 30 L44 30 L36 36 L39 46 L30 40 L21 46 L24 36 L16 30 L26 30 Z"/>
                  <path d="M80 6 L84 16 L94 16 L86 22 L89 32 L80 26 L71 32 L74 22 L66 16 L76 16 Z"/>
                  <path d="M130 20 L134 30 L144 30 L136 36 L139 46 L130 40 L121 46 L124 36 L116 30 L126 30 Z"/>
                </svg>

                <svg class="sparkles" viewBox="0 0 200 150" aria-hidden="true">
                  <path d="M50 30 Q50 50 30 50 Q50 50 50 70 Q50 50 70 50 Q50 50 50 30 Z"/>
                  <path d="M140 25 Q140 40 125 40 Q140 40 140 55 Q140 40 155 40 Q140 40 140 25 Z"/>
                  <path d="M100 65 Q100 85 80 85 Q100 85 100 105 Q100 85 120 85 Q100 85 100 65 Z"/>
                </svg>
              </div>

              <div class="screen-frame__bottom">
                <button class="red-dot" id="btn-cry" aria-label="Play Pokémon cry" title="Play cry"></button>
                <span class="screen-frame__label">♪ CRY</span>
                <span class="speaker" aria-hidden="true"></span>
              </div>
            </div>

            <div class="controls">
              <button class="round-btn" id="btn-random" aria-label="Random Pokémon" title="Random">?</button>

              <div class="pill-btns">
                <button class="pill pill--red" id="btn-shiny" title="Shiny version">✦ SHINY</button>
                <button class="pill pill--blue" id="btn-flip" title="View back sprite">↻ FLIP</button>
              </div>

              <div class="dpad" aria-label="Navigation">
                <img src="assets/dpad.svg" alt="" class="dpad__img">
                <button class="dpad__up" data-step="-10" aria-label="Back 10"></button>
                <button class="dpad__left" data-step="-1" aria-label="Previous"></button>
                <button class="dpad__right" data-step="1" aria-label="Next"></button>
                <button class="dpad__down" data-step="10" aria-label="Forward 10"></button>
              </div>
            </div>
            <form class="search" id="dex-search" autocomplete="off" role="search">
              <label for="dex-input" class="sr-only">Search Pokémon by name or number</label>
              <input id="dex-input" class="lcd-input" type="text" placeholder="NAME OR NO..." spellcheck="false">
              <button class="search__btn" id="dex-search-btn" type="submit">SEARCH</button>
              <ul class="suggest" id="dex-suggest" role="listbox"></ul>
            </form>
          </div>

          <div class="dex__hinge" aria-hidden="true"></div>

          <!-- RIGHT HALF -->
          <div class="dex__right">
            <div class="lcd">
              <div class="lcd__head">
                <h2 id="dex-name">---</h2>
                <span id="dex-genus" class="lcd__genus"></span>
              </div>
              <div class="lcd__body" id="dex-panel"></div>
            </div>

            <div class="blue-keys" role="tablist" aria-label="Information tabs">
              <button class="blue-key is-active" data-panel="info" id="key-info">INFO</button>
              <button class="blue-key" data-panel="stats" id="key-stats">STATS</button>
              <button class="blue-key" data-panel="evo" id="key-evo">EVOLUTION</button>
              <button class="blue-key" data-panel="types" id="key-types">TYPES</button>
              <button class="blue-key" data-panel="moves" id="key-moves">MOVES</button>
            </div>

            <div class="dex__actions">
              <button class="action action--catch" id="btn-catch">
                <img src="assets/pokeball.svg" alt="" class="action__ball-img" width="22" height="22">
                <span class="action__txt">CATCH</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- ================= EXPLORAR ================= -->
      <section id="view-explore" class="view" role="tabpanel" aria-labelledby="tab-explore" hidden>
        <div class="section-title">
          <h2>EXPLORE POKÉMON WORLD</h2>
          <p>Filter by region, type, or name. Click to open in Pokédex!</p>
        </div>

        <div class="explore-bar card">
          <div class="explore-bar__row">
            <label class="field">
              <span>REGION</span>
              <select id="f-gen" class="select-retro"></select>
            </label>
            <label class="field field--grow">
              <span>NAME</span>
              <input id="f-name" class="lcd-input" type="text" placeholder="FILTER..." spellcheck="false">
            </label>
            <span class="explore-count" id="explore-count">—</span>
          </div>
          <div class="chips" id="f-types" aria-label="Filter by type"></div>
        </div>

        <div class="grid" id="explore-grid"></div>
        <div class="grid-status">
          <button class="btn-retro" id="explore-more" hidden>LOAD MORE</button>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pokedex.js"></script>
  <script src="js/explore.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
